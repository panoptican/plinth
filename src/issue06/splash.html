  <style type="text/css" media="screen">
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .body {
      background-color:#C3C3C3;
    }
    .logo {
      position: absolute;
      top: 160px;
      left: 50%;
      margin-left: -400px;
      filter: invert(100%) grayscale(50%);
    }
    .broken-node-left {
      position: absolute;
      top: 22px;
      left: 2vw;
    }
    .broken-node-right {
      position: absolute;
      top: 22px;
      right: 2vw;
    }
    .broken-node-right img {
      -moz-transform: scaleX(-1);
      -o-transform: scaleX(-1);
      -webkit-transform: scaleX(-1);
      transform: scaleX(-1);
      filter: FlipH;
      -ms-filter: "FlipH";
    }
    .broken-node-left img,
    .broken-node-right img {
      height: 42vh;
      filter: invert(100%) opacity(50%);
    }
    #canvas-basic {
        position: absolute;
        display: block;
        width: 100%;
        height: 100%;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
    }
  </style>

  <!-- Javascript
    –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <script src="./js/granim.js"></script>
  <script>
  var granimInstance = new Granim({
     element: '#canvas-basic',
     name: 'granim',
     direction: 'radial',
     opacity: [1, 1],
     isPausedWhenNotInView: true,
     states : {
      "default-state": {
        gradients: [
        ['#E3E3E3', '#C8C8C8'],
        ['#161616', '#B5B5B7'],
        ['#423B45', '#EAE9EC']
        ]
      }
    }
  });
  </script>
